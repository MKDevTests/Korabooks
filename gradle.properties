kotlin.code.style=official
# Both daemons are capped, and deliberately so. Only the Kotlin one was,
# at 8 GB; the Gradle daemon had no ceiling and grew to 6.3 GB beside it.
# Together they filled a 12 GB WSL allocation and packageDebug — the last
# task of the build, after every compilation had already succeeded — died
# on "Cannot allocate memory" with 604 MB left. 4 GB each leaves the
# packaging step room to work in.
org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# TODO remove after https://youtrack.jetbrains.com/issue/KT-63353/K2-KMP-Incremental-compilation
# incremental build is disabled by default as a workaround for the bug https://youtrack.jetbrains.com/issue/KT-62686
kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform=true

# build variants that enables/disables variant specific features
# standalone, fdroid or play
snd.android.variant="standalone"